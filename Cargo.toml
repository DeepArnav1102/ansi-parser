[package]
name = "ansi-parser"
version = "0.1.0"
edition = "2024"
description = "An incremental ANSI and terminal escape sequence parser for Rust"
license = "MIT"
readme = "README.md"
keywords = ["ansi", "terminal", "parser", "escape-sequences"]
categories = ["parsing", "command-line-interface"]

# The fuzz harness is its own workspace (see fuzz/Cargo.toml); it is built
# separately with `cargo fuzz` and must not be pulled in here.
[workspace]
exclude = ["fuzz"]

[dev-dependencies]
proptest = "1.12.0"
