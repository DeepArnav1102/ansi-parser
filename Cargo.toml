[package]
name = "nc-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An incremental ANSI and terminal escape sequence parser for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DeepArnav1102/nc-parser"
homepage = "https://github.com/DeepArnav1102/nc-parser"
documentation = "https://docs.rs/nc-parser"
keywords = ["ansi", "terminal", "parser", "escape-sequences"]
categories = ["parsing", "command-line-interface"]
include = ["src/**", "examples/**", "benches/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md", "Cargo.toml"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

# The fuzz harness is its own workspace (see fuzz/Cargo.toml); it is built
# separately with `cargo fuzz` and must not be pulled in here.
[workspace]
exclude = ["fuzz"]

[dev-dependencies]
proptest = "1.12.0"

[[bench]]
name = "parser_bench"
harness = false
